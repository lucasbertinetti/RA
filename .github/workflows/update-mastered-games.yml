name: Update mastered games

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:17 UTC (02:17 in Brazil UTC-3).
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/ra_api.py"
      - "scripts/update_mastered_games.py"
      - ".github/workflows/update-mastered-games.yml"

permissions:
  contents: write

concurrency:
  group: update-mastered-games
  cancel-in-progress: false

jobs:
  update:
    # Prevent the data commit made below from recursively running this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh RetroAchievements snapshot
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          RA_USERNAME: berti
        run: python scripts/update_mastered_games.py

      - name: Commit updated game data
        run: |
          if git diff --quiet -- mastered-games.json; then
            echo "No game data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mastered-games.json
          git commit -m "Update mastered games data"
          git push
