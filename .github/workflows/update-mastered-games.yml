name: Update RetroAchievements data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/ra_api.py"
      - "scripts/update_games_log.py"
      - "legacy/franchises-source.json"
      - ".github/workflows/update-mastered-games.yml"

permissions:
  contents: write

concurrency:
  group: update-retroachievements-data
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh unified game log
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          RA_USERNAME: berti
        run: python scripts/update_games_log.py
      - name: Commit updated game log
        run: |
          if git diff --quiet -- games-log.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games-log.json
          git commit -m "Update beaten and mastered games log"
          git pull --rebase origin main
          git push origin HEAD:main
