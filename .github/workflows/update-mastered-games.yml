name: Update RetroAchievements data

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:17 UTC (02:17 in Brazil UTC-3).
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/ra_api.py"
      - "scripts/update_mastered_games.py"
      - "scripts/update_franchises.py"
      - "franchises-source.json"
      - ".github/workflows/update-mastered-games.yml"

permissions:
  contents: write

concurrency:
  group: update-retroachievements-data
  cancel-in-progress: false

jobs:
  update:
    # Prevent the data commit made below from recursively running this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # The first full Series sync may need hundreds of one-time game metadata
    # lookups. Subsequent runs are much faster because franchises.json is cache.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Series updater dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 selenium

      - name: Refresh mastered and beaten games
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          RA_USERNAME: berti
        run: python scripts/update_mastered_games.py

      - name: Refresh franchise catalog
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          FRANCHISE_API_WORKERS: "3"
        run: python scripts/update_franchises.py

      - name: Commit updated RA data
        run: |
          if git diff --quiet -- mastered-games.json franchises.json; then
            echo "No RetroAchievements data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mastered-games.json franchises.json
          git commit -m "Update RetroAchievements data"
          git push
